id: echo-validation-node-update-001
title: 更新已有文本节点
agent: echo
skill: canvas-ops
category: node-creation
scenario: core_logic
risk: P1
tags: [update, validation]
source: expert
status: active
dataset_split: validation
precondition:
  canvasType: content
  initialState:
    nodes: [{ id: node-role, type: text, title: 初始设定 }]
    connections: []
  cleanup: rollback
input:
  type: text
  message: 将“初始设定”文本节点标题改为“角色设定”
  fixture_refs: [echo/content-one-text-node-v1.json]
expected:
  toolCalls: [{ tool: canvas_update_node, params: { id: { $eq: node-role }, title: { $eq: 角色设定 } } }]
  stateAfter: { nodeCount: { $eq: 1 } }
  max_tool_calls: 5
judge:
  strategy: rule
  rules: [{ type: tool_call_match }, { type: param_check }, { type: state_diff_check }]
  consistency: { repeat: 3, requireConsecutive: true }
ground_truth_version: echo-canvas-v1
