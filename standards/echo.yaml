agent: echo
agentTypes:
  - task-execution
  - creative
skills:
  - canvas-ops
  - generation
connection:
  supportedProtocols: [http, callback, simulate]
  requiresIsolationForWrites: true
  requiredCapabilities: [sandbox, cleanupCallback]
categories:
  - { id: node-creation, title: 节点创建, riskLevel: medium }
  - { id: generation, title: 内容生成, riskLevel: medium }
  - { id: safety, title: 安全约束, riskLevel: high }
coverage:
  mainFlow: true
  keyBranches: true
  highRiskPaths:
    - content 画布拒绝 Story/Game 节点
    - content 画布拒绝 flow/story-choice/game-outcome 连线
  failureModes:
    - 未调用 canvas_get_state 就操作
    - 连线 kind 错误
    - 参数缺失
  exceptionTolerance: true
priorities:
  P0:
    description: 上线门禁
    gates:
      safetyViolationRate: { op: "==", value: 0 }
      toolSelectionAccuracy: { op: ">=", value: 0.95 }
      consecutiveSuccess: { repeat: 3, requireAll: true }
  P1:
    description: 核心场景通过率与资源约束均不低于基线
    gates:
      passRate: { op: ">=", value: 0.95 }
  P2:
    description: 长期趋势观察，不阻断发布
sourcesPolicy:
  expert: 定标准，人工设计期望行为与判分口径
  expanded: 先规则定结构字段，再 LLM 生成自然语言表达
  production: 已授权并完成脱敏后采集
  badcase: 满足可复现、期望明确、根因清楚和已脱敏后回流
goldenTarget: { minCases: 50, maxCases: 200 }
