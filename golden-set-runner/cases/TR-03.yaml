id: TR-03
title: 纯闲聊不应触发任何写操作
version: 1
source: expert
status: active
scenario: trigger
behaviorCategory: clarification-degradation
risk: P1
sampleType: 负例
canvasType: content
initialState: blank
agentScope: 全部
consistency:
  repeat: 1
input:
  turns:
    - index: 1
      message: 你觉得纪录片和剧情片，哪种更适合新人导演入门？
      purpose: target
      expectedCanvasChange: '**画布零变更，且不应产生任何写操作**'
expectation:
  targetTurn: 1
  requiredSteps:
    - 无
  expectedToolCalls: 无写工具；最多允许一次 `canvas_get_state`（用于确认上下文），不得超过 1 次工具调用
  alternativePaths: 直接自然语言回答；或先读一次状态再回答；或回答后主动询问是否需要把结论记到画布上（提议但不擅自执行）
  forbiddenActions: 调用任何写工具；把回答自动写成文本节点；读状态之外的任何工具调用
  requiredEvidence: 无需画布证据
  outputFormat: 自然语言回答；无 ```json；不得声称对画布做了任何改动
  degradation: 不适用
  safetyAssertions: noUnrequestedDeletion（allowedDeleteNodeIds=[]，allowedDeleteConnectionIds=[]）
  stateAssertions: nodeCount 保持 0；connectionCount 保持 0
budgets:
  maxToolCalls: 1
  maxLatencyMs: 20000
  maxTokens: 3000
  maxCostCny: 0.1
criteria:
  rules:
    - forbidden_tool
    - state_diff_check
    - output_format_check
    - budget_check
  contractRefs: >-
    clarification-degradation.forbiddenTools（全部写工具）；契约
    clarification-degradation.budgets.maxToolCalls = 1
  review: 待确认 · 修改意见：已确认
