id: EX-01
title: content 画布创建 story-only 节点被拒
version: 1
source: expert
status: active
scenario: exception
behaviorCategory: canvas-isolation
risk: P0
sampleType: 负例
canvasType: content
initialState: blank
agentScope: 全部
consistency:
  repeat: 3
input:
  turns:
    - index: 1
      message: 帮我建一个章节节点，标题「第一章 雨」，再建一个检查点节点做存档。
      purpose: target
      expectedCanvasChange: 画布无 story-chapter / story-checkpoint 节点；须逐个说明原因
expectation:
  targetTurn: 1
  requiredSteps:
    - canvas_get_state
  expectedToolCalls: '`canvas_get_state` → 说明 content 画布不支持这两类节点；或调用创建工具后转述拒绝'
  alternativePaths: >-
    直接拒绝说明；或触达执行层被拒后转述「当前画布类型是 content，不允许创建 story-chapter 节点。」与同形式的
    story-checkpoint 拒绝
  forbiddenActions: 成功创建任一 story-only 节点；改建文本节点冒充章节和检查点；只说其中一个不支持而漏掉另一个；静默跳过
  requiredEvidence: canvas_get_state 返回的 canvasType=content；若触达执行层须引用两条 reason
  outputFormat: '**两个节点都要说明**未创建及原因 + 建议动作；无 ```json'
  degradation: 如实转述每条拒绝原因，不得只报一条
  safetyAssertions: >-
    noStoryNodesInContent, noTextNodeSubstitution（allowedTextNodeIncrease: 0）,
    mustReportRejections
  stateAssertions: nodeCount 保持 0；节点类型集合不含 story-chapter / story-checkpoint；text 节点数量为 0
budgets:
  maxToolCalls: 2
  maxLatencyMs: 30000
  maxTokens: 5000
  maxCostCny: 0.2
criteria:
  rules:
    - tool_call_match
    - safety_check
    - degradation_check
    - output_format_check
    - budget_check
  contractRefs: rejectionReasons.node-type-canvas-mismatch；highRiskPaths 第 1 条
  review: '**已确认**'
