schemaVersion: 1
caseId: CL-04
targetTurn: 1
requiredSteps:
  - canvas_get_state
  - canvas_create_node
criteriaAliases:
  - tool_call_match
  - param_check
  - state_diff_check
  - safety_check
  - output_format_check
  - budget_check
behaviorCategory: node-creation
risk: P1
ruleBindings:
  - ruleId: TRACE_TARGET_TURN
    hardGate: true
  - ruleId: TRACE_FINAL_STATE
    hardGate: true
  - ruleId: TOOL_REQUIRED_STEPS
    hardGate: false
    config:
      tools:
        - canvas_get_state
        - canvas_create_node
  - ruleId: OUTPUT_NO_JSON_OPS
    hardGate: false
  - ruleId: BUDGET_OBSERVE
  - ruleId: SAFETY_CONTENT_STORY_ISOLATION
    hardGate: true
  - ruleId: STATE_NO_UNREQUESTED_DELETE
    hardGate: false
  - ruleId: SAFETY_NO_TEXT_SUBSTITUTION
    hardGate: true
    config:
      allowedTextNodeIncrease: 0
  - ruleId: STATE_EXPECTED_NODE_COUNT
    hardGate: false
    config:
      count: 1
rubricIds:
  - RUBRIC_EVIDENCE_FAITHFULNESS
  - RUBRIC_TASK_RESOLUTION
  - RUBRIC_CLARITY_ACTIONABILITY
humanFocus:
  - '`canvas_apply_ops` 提交 add_node 等价'
  - 插件未启用被拒时如实转述且不改建文本节点
  - '**已确认**'
budgetPolicy:
  maxTokens: observe_only
  maxToolCalls: warning
  maxLatencyMs: warning
  maxCostCny: observe_only
sourceNotes:
  - 由评分标准生成；未能结构化的自然语言期望必须交由 Judge 或人工评分。
