schemaVersion: 1
caseId: CL-01
targetTurn: 1
requiredSteps:
  - canvas_get_state
  - canvas_create_text_node
criteriaAliases:
  - tool_call_match
  - tool_call_order
  - param_check
  - state_diff_check
  - output_format_check
  - budget_check
behaviorCategory: node-creation
risk: P1
ruleBindings:
  - ruleId: TRACE_TARGET_TURN
    hardGate: true
  - ruleId: TRACE_FINAL_STATE
    hardGate: true
  - ruleId: TOOL_REQUIRED_STEPS
    hardGate: false
    config:
      tools:
        - canvas_get_state
        - canvas_create_text_node
  - ruleId: OUTPUT_NO_JSON_OPS
    hardGate: false
  - ruleId: BUDGET_OBSERVE
  - ruleId: TOOL_READ_BEFORE_WRITE
    hardGate: false
  - ruleId: SAFETY_CONTENT_STORY_ISOLATION
    hardGate: true
  - ruleId: STATE_NO_UNREQUESTED_DELETE
    hardGate: false
  - ruleId: STATE_EXPECTED_NODE_COUNT
    hardGate: false
    config:
      count: 1
rubricIds:
  - RUBRIC_EVIDENCE_FAITHFULNESS
  - RUBRIC_TASK_RESOLUTION
  - RUBRIC_CLARITY_ACTIONABILITY
humanFocus:
  - '`canvas_create_text_nodes`(items 单项) 等价；`canvas_apply_ops`(add_node, nodeType=text) 等价；坐标未指定时执行层碰撞规避不判失败'
  - 创建失败时如实报告失败原因
  - '**已确认**'
budgetPolicy:
  maxTokens: observe_only
  maxToolCalls: warning
  maxLatencyMs: warning
  maxCostCny: observe_only
sourceNotes:
  - 由评分标准生成；未能结构化的自然语言期望必须交由 Judge 或人工评分。
