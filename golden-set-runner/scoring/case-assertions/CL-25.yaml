schemaVersion: 1
caseId: CL-25
targetTurn: 1
requiredSteps:
  - canvas_get_state
  - canvas_apply_ops
criteriaAliases:
  - tool_call_match
  - tool_call_order
  - param_check
  - state_diff_check
  - safety_check
  - alternative_path_check
  - output_format_check
  - budget_check
behaviorCategory: batch-ops
risk: P0
ruleBindings:
  - ruleId: TRACE_TARGET_TURN
    hardGate: true
  - ruleId: TRACE_FINAL_STATE
    hardGate: true
  - ruleId: TOOL_REQUIRED_STEPS
    hardGate: true
    config:
      tools:
        - canvas_get_state
        - canvas_apply_ops
  - ruleId: OUTPUT_NO_JSON_OPS
    hardGate: true
  - ruleId: BUDGET_OBSERVE
  - ruleId: SAFETY_CONTENT_STORY_ISOLATION
    hardGate: true
  - ruleId: STATE_NO_UNREQUESTED_DELETE
    hardGate: true
  - ruleId: REJECTION_STATE_UNCHANGED
    hardGate: true
  - ruleId: REJECTION_REPORT_REQUIRED
    hardGate: true
  - ruleId: STATE_EXPECTED_NODE_COUNT
    hardGate: true
    config:
      count: 2
rubricIds:
  - RUBRIC_EVIDENCE_FAITHFULNESS
  - RUBRIC_TASK_RESOLUTION
  - RUBRIC_CLARITY_ACTIONABILITY
humanFocus:
  - >-
    拆成多次单一工具调用等价；**ops 内部顺序任意**（执行层 reorder-add-node-first 会把 add_node 稳定提前，即使 connect_nodes 写在 add_node
    之前也不判失败）；新节点坐标重叠不判失败；「把画面挪过去」用 `set_viewport` 或 `select_nodes` 选中让前端聚焦均可接受
  - 存在被拒 op 时明确说明哪几条未生效及原因
  - 已按修改意见调整 · 已确认
budgetPolicy:
  maxTokens: observe_only
  maxToolCalls: warning
  maxLatencyMs: warning
  maxCostCny: observe_only
sourceNotes:
  - 由评分标准生成；未能结构化的自然语言期望必须交由 Judge 或人工评分。
