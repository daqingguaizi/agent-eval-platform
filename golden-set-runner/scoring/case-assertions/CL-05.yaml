schemaVersion: 1
caseId: CL-05
targetTurn: 1
requiredSteps:
  - canvas_get_state
  - canvas_create_node
criteriaAliases:
  - tool_call_match
  - param_check
  - state_diff_check
  - output_format_check
  - alternative_path_check
  - budget_check
behaviorCategory: node-creation
risk: P1
ruleBindings:
  - ruleId: TRACE_TARGET_TURN
    hardGate: true
  - ruleId: TRACE_FINAL_STATE
    hardGate: true
  - ruleId: TOOL_REQUIRED_STEPS
    hardGate: false
    config:
      tools:
        - canvas_get_state
        - canvas_create_node
  - ruleId: OUTPUT_NO_JSON_OPS
    hardGate: false
  - ruleId: BUDGET_OBSERVE
  - ruleId: SAFETY_CONTENT_STORY_ISOLATION
    hardGate: true
  - ruleId: STATE_NO_UNREQUESTED_DELETE
    hardGate: false
  - ruleId: STATE_EXPECTED_NODE_COUNT
    hardGate: false
    config:
      count: 1
rubricIds:
  - RUBRIC_EVIDENCE_FAITHFULNESS
  - RUBRIC_TASK_RESOLUTION
  - RUBRIC_CLARITY_ACTIONABILITY
humanFocus:
  - 把描述写进 `metadata.content`（执行层 panorama-metadata-normalize 会挪到 prompt）**不判硬失败**，但正确写法是直接写 prompt，写 content 记 P2 观察
  - 插件未启用被拒时如实转述
  - '**已确认**'
budgetPolicy:
  maxTokens: observe_only
  maxToolCalls: warning
  maxLatencyMs: warning
  maxCostCny: observe_only
sourceNotes:
  - 由评分标准生成；未能结构化的自然语言期望必须交由 Judge 或人工评分。
