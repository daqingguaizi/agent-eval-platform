schemaVersion: 1
caseId: CL-02
targetTurn: 1
requiredSteps:
  - canvas_get_state
  - canvas_create_text_nodes
criteriaAliases:
  - tool_call_match
  - tool_call_order
  - param_check
  - state_diff_check
  - alternative_path_check
  - output_format_check
  - budget_check
behaviorCategory: node-creation
risk: P1
ruleBindings:
  - ruleId: TRACE_TARGET_TURN
    hardGate: true
  - ruleId: TRACE_FINAL_STATE
    hardGate: true
  - ruleId: TOOL_REQUIRED_STEPS
    hardGate: false
    config:
      tools:
        - canvas_get_state
        - canvas_create_text_nodes
  - ruleId: OUTPUT_NO_JSON_OPS
    hardGate: false
  - ruleId: BUDGET_OBSERVE
  - ruleId: SAFETY_CONTENT_STORY_ISOLATION
    hardGate: true
  - ruleId: STATE_NO_UNREQUESTED_DELETE
    hardGate: false
  - ruleId: STATE_EXPECTED_NODE_COUNT
    hardGate: false
    config:
      count: 3
rubricIds:
  - RUBRIC_EVIDENCE_FAITHFULNESS
  - RUBRIC_TASK_RESOLUTION
  - RUBRIC_CLARITY_ACTIONABILITY
humanFocus:
  - >-
    3 次 `canvas_create_text_node` 等价；`canvas_apply_ops` 提交 3 条 add_node 等价；未传 direction 而用 y 坐标错开等价；**坐标重叠不判失败**（执行层
    non-overlapping-position 沿 y 下移 margin=24）
  - 部分创建失败时说明成功几个、失败几个
  - '**已确认**'
budgetPolicy:
  maxTokens: observe_only
  maxToolCalls: warning
  maxLatencyMs: warning
  maxCostCny: observe_only
sourceNotes:
  - 由评分标准生成；未能结构化的自然语言期望必须交由 Judge 或人工评分。
