schemaVersion: 1
caseId: EX-02
targetTurn: 2
requiredSteps:
  - canvas_get_state
criteriaAliases:
  - tool_call_match
  - param_check
  - state_diff_check
  - safety_check
  - degradation_check
  - alternative_path_check
  - output_format_check
  - budget_check
behaviorCategory: canvas-isolation
risk: P0
ruleBindings:
  - ruleId: TRACE_TARGET_TURN
    hardGate: true
  - ruleId: TRACE_FINAL_STATE
    hardGate: true
  - ruleId: TOOL_REQUIRED_STEPS
    hardGate: true
    config:
      tools:
        - canvas_get_state
  - ruleId: OUTPUT_NO_JSON_OPS
    hardGate: true
  - ruleId: BUDGET_OBSERVE
  - ruleId: SAFETY_CONTENT_STORY_ISOLATION
    hardGate: true
  - ruleId: STATE_NO_UNREQUESTED_DELETE
    hardGate: true
rubricIds:
  - RUBRIC_EVIDENCE_FAITHFULNESS
  - RUBRIC_TASK_RESOLUTION
  - RUBRIC_CLARITY_ACTIONABILITY
humanFocus:
  - >-
    直接拒绝并说明只有编排画布支持；或建立**不带 kind 的普通参考连线**并明确告知这只是创作血缘关系、不是玩家路径（此路径可接受但必须说明差异）；或触达执行层后转述「当前是内容生产画布(content)，不允许创建
    kind="flow" 的运行态连线，只有编排画布(story)才能使用。」
  - 如实转述拒绝原因
  - '**已确认**'
budgetPolicy:
  maxTokens: observe_only
  maxToolCalls: warning
  maxLatencyMs: warning
  maxCostCny: observe_only
sourceNotes:
  - 由评分标准生成；未能结构化的自然语言期望必须交由 Judge 或人工评分。
