schemaVersion: 1
caseId: CL-16
targetTurn: 1
requiredSteps:
  - canvas_get_state
  - canvas_connect_nodes
criteriaAliases:
  - tool_call_match
  - tool_call_order
  - param_check
  - state_diff_check
  - alternative_path_check
  - output_format_check
  - budget_check ＋ LLM Judge：编排可玩性
behaviorCategory: story-orchestration
risk: P1
ruleBindings:
  - ruleId: TRACE_TARGET_TURN
    hardGate: true
  - ruleId: TRACE_FINAL_STATE
    hardGate: true
  - ruleId: TOOL_REQUIRED_STEPS
    hardGate: false
    config:
      tools:
        - canvas_get_state
        - canvas_connect_nodes
  - ruleId: OUTPUT_NO_JSON_OPS
    hardGate: false
  - ruleId: BUDGET_OBSERVE
  - ruleId: TOOL_READ_BEFORE_WRITE
    hardGate: false
  - ruleId: STATE_NO_UNREQUESTED_DELETE
    hardGate: false
rubricIds:
  - RUBRIC_EVIDENCE_FAITHFULNESS
  - RUBRIC_TASK_RESOLUTION
  - RUBRIC_CLARITY_ACTIONABILITY
humanFocus:
  - >-
    先建节点再连线，或用 `canvas_apply_ops` 一次提交（**执行层 reorder-add-node-first 会把 add_node 提前，ops 顺序错误不判失败**）；结局用 story 节点 +
    metadata.storyEndingType 表达
  - 被引用节点不存在时如实转述并说明未建立该连线
  - '**已确认**'
budgetPolicy:
  maxTokens: observe_only
  maxToolCalls: warning
  maxLatencyMs: warning
  maxCostCny: observe_only
sourceNotes:
  - 由评分标准生成；未能结构化的自然语言期望必须交由 Judge 或人工评分。
